name: CI

# Verifies every push and pull request: the .proto contracts lint and stay
# backward-compatible with the last release, plus formatting and that the gRPC
# stubs generate and compile from those .proto.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new buf release can't turn a green contract red on its own.
  BUF_VERSION: 1.75.0

jobs:
  # The contract gate. Lexicon's whole job is being the constellation's shared
  # wire format, so a breaking .proto edit must fail HERE — once a semver tag
  # publishes, the jar and wheel are immutable and consumers are already pinned.
  proto:
    name: Proto lint & breaking-change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the breaking check reads history to resolve its baseline tag
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: buf lint
      - name: Breaking-change check against the last release
        run: |
          baseline="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          if [ -z "$baseline" ]; then
            echo "No v* tag yet — nothing has been published that could break. Skipping."
            exit 0
          fi
          echo "Comparing the working tree against $baseline"
          # --against-config pins the HISTORICAL tree to today's module layout.
          # Tags cut before buf.yaml existed carry no module definition of their
          # own, so without this buf would read that tree as one root-level
          # module and fail to resolve the protos' import paths.
          buf breaking --against ".git#tag=${baseline}" --against-config buf.yaml

  build:
    name: Generate & compile stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sbt-dynver needs full history + tags
      - uses: ./.github/actions/setup-scala
      - name: Check formatting
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck
      - name: Compile & test
        run: sbt -batch compile test

  python:
    name: Python stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test the Python client
        run: |
          python -m pip install --upgrade pip
          pip install ./python pytest
          python -m pytest python/tests -q
