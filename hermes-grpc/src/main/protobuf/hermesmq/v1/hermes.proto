syntax = "proto3";

package hermesmq.v1;

option java_package = "me.cference.hermesmq.grpc";
option java_multiple_files = true;

// ---- Shared messages --------------------------------------------------------

// A topic and its labels/metadata.
message Topic {
  string topic_id = 1;
  map<string, string> labels = 2;
  // The topic's current message TTL, so the TTL settable on create/update is
  // also READABLE. Without it `GetTopic` cannot report the TTL and
  // `UpdateTopicResponse.topic` would confirm an update while omitting the
  // field just updated — and since `UpdateTopicRequest.ttl_seconds = 0` means
  // "leave untouched", a caller could not discover the current value in order
  // to decide. 0 = no topic TTL.
  int32 ttl_seconds = 3;
}

// An immutable message envelope. publish_time is ISO-8601 UTC (mirrors REST).
message Message {
  string message_id = 1;
  bytes payload = 2;
  map<string, string> attributes = 3;
  string publish_time = 4;
  // Request-tracing correlation id (request-correlation). Carried across service
  // hops so one id stitches a logical operation across the constellation: a
  // producer sets it on publish, the broker carries it verbatim (never strips or
  // mints), a consumer reads it on delivery and adopts it. Empty = none supplied,
  // which the consumer treats as "mint one". See CorrelationNames.Envelope.
  string correlation_id = 5;
}

// One outstanding message returned by a pull.
message PulledMessage {
  string ack_id = 1;
  Message message = 2;
}

// ---- Topic administration ---------------------------------------------------

service TopicAdminService {
  rpc CreateTopic (CreateTopicRequest) returns (CreateTopicResponse) {}
  rpc GetTopic (GetTopicRequest) returns (GetTopicResponse) {}
  rpc UpdateTopic (UpdateTopicRequest) returns (UpdateTopicResponse) {}
  rpc DeleteTopic (DeleteTopicRequest) returns (DeleteTopicResponse) {}
}

message CreateTopicRequest {
  string topic_id = 1;
  map<string, string> labels = 2;
  // Optional per-topic TTL applied to messages published to this topic
  // (message-ttl). Resolution is SHORTEST WINS across the per-publish
  // `ttl_seconds`, this, the subscription's, and the broker's global default:
  // any layer may shorten a message's lifetime, none may extend it. 0 = no
  // topic TTL. Negative is rejected rather than treated as off.
  int32 ttl_seconds = 3;
}
message CreateTopicResponse {}

message GetTopicRequest {
  string topic_id = 1;
}
message GetTopicResponse {
  Topic topic = 1;
}

message UpdateTopicRequest {
  string topic_id = 1;
  map<string, string> labels = 2;
  // Change the topic's TTL. Forward-looking only: a message's expiry is fixed
  // when it is published, so this does not move the expiry of messages already
  // published. 0 = leave the TTL untouched (clearing an existing TTL is
  // deliberately not expressible — it would need a three-state field).
  int32 ttl_seconds = 3;
}
message UpdateTopicResponse {
  Topic topic = 1;
}

message DeleteTopicRequest {
  string topic_id = 1;
}
message DeleteTopicResponse {}

// ---- Publish & consume ------------------------------------------------------

service PubSubService {
  rpc Publish (PublishRequest) returns (PublishResponse) {}
  rpc CreateSubscription (CreateSubscriptionRequest) returns (CreateSubscriptionResponse) {}
  rpc Pull (PullRequest) returns (PullResponse) {}
  rpc StreamMessages (StreamRequest) returns (stream PulledMessage) {}
  rpc Consume (stream ConsumeRequest) returns (stream PulledMessage) {}
  rpc Ack (AckRequest) returns (AckResponse) {}
  rpc ModifyAckDeadline (ModifyAckDeadlineRequest) returns (ModifyAckDeadlineResponse) {}
}

message PublishRequest {
  string topic_id = 1;
  bytes payload = 2;
  map<string, string> attributes = 3;
  // Optional per-message TTL in seconds (0 = use the configured default / none).
  int32 ttl_seconds = 4;
  // Optional producer idempotency key. When dedup is enabled on the broker, a
  // retry carrying the same key for the same topic within the dedup window is
  // collapsed to the original publish. Empty = no key (no deduplication).
  string idempotency_key = 5;
  // Optional producer id for observability (active-producer metric + log MDC).
  // Empty = anonymous; does not affect whether/how the message is published.
  string producer_id = 6;
  // Request-tracing correlation id the producer sets on publish (request-correlation).
  // The broker carries it onto the delivered `Message.correlation_id` verbatim —
  // never mints, never strips — so a consumer can adopt it. Empty = none.
  // (Field 7: 6 is `producer_id`, added after this change was drafted.)
  string correlation_id = 7;
}
message PublishResponse {
  string message_id = 1;
  // True when this publish was recognised as a duplicate within the dedup
  // window and collapsed to the original message (message_id is the original).
  bool deduplicated = 2;
}

// Where a new subscription starts reading its topic (subscription-back-delivery).
//
// UNSPECIFIED is NOW, so a client generated before this field existed keeps
// exactly its previous behaviour.
enum StartPosition {
  START_POSITION_UNSPECIFIED = 0;
  // Only messages published after the subscription was created.
  START_POSITION_NOW = 1;
  // Back-deliver the topic's retained history as well. NOTE: "earliest" means
  // earliest STILL RETAINED — snapshot retention purges older journal events,
  // so on a long-lived topic this is not everything ever published. The
  // back-delivery is asynchronous and happens at most once per subscription.
  START_POSITION_EARLIEST = 2;
}

message CreateSubscriptionRequest {
  string subscription_id = 1;
  string topic_id = 2;
  // Default (UNSPECIFIED) = NOW, preserving pre-existing behaviour.
  StartPosition start_from = 3;
  // Optional per-subscription TTL, resolved at delivery. Shortens this
  // subscription's copy of a message where it is earlier than the expiry the
  // message already carries; never extends it. 0 = no subscription TTL.
  int32 ttl_seconds = 4;
}
message CreateSubscriptionResponse {
  // The start position the broker ACTUALLY applied — echoed because a dropped
  // `start_from` is otherwise UNOBSERVABLE, and this is the one field where
  // that matters.
  //
  // proto3 discards unknown fields, so a broker built against a contract
  // without `start_from` silently ignores an EARLIEST request and creates a
  // NOW subscription, returning success. For `ttl_seconds` that degradation is
  // benign (you get the default); for `start_from` the request is a request
  // ABOUT HISTORY, and losing it means the subscriber misses everything
  // published before it existed — the exact failure back-delivery was built to
  // prevent. That state is not hypothetical: every broker behaves this way
  // until `hermesmq` bumps its pin and wires the field through.
  //
  // An old broker returns an empty response, which decodes as UNSPECIFIED, so
  // a caller comparing this against what it asked for can tell "honoured" from
  // "silently downgraded". A caller that asked for EARLIEST and reads back
  // UNSPECIFIED SHOULD treat its back-delivery as NOT having happened.
  StartPosition effective_start_from = 1;
}

message PullRequest {
  string subscription_id = 1;
  int32 max = 2;
  // Optional consumer id for observability (active-consumer metric + log MDC).
  // Empty = anonymous; does not affect which messages are leased.
  string consumer_id = 3;
}
message PullResponse {
  repeated PulledMessage messages = 1;
}

// Open a server stream of leased messages. `max` is the per-lease batch (0 = the
// configured default). Acknowledge received messages with the unary Ack RPC.
message StreamRequest {
  string subscription_id = 1;
  int32 max = 2;
  // Optional consumer id for observability (see PullRequest.consumer_id).
  string consumer_id = 3;
}

// Bidirectional consume: the first request MUST be a ConsumeStart; subsequent
// requests are ConsumeAcks that acknowledge received messages on the same stream.
message ConsumeStart {
  string subscription_id = 1;
  int32 max = 2;
  // Optional consumer id for observability (see PullRequest.consumer_id).
  string consumer_id = 3;
}
message ConsumeAck {
  repeated string ack_ids = 1;
}
message ConsumeRequest {
  oneof kind {
    ConsumeStart start = 1;
    ConsumeAck ack = 2;
  }
}

message AckRequest {
  string subscription_id = 1;
  repeated string ack_ids = 2;
}
message AckResponse {
  repeated string acknowledged = 1;
  repeated string unknown = 2;
}

message ModifyAckDeadlineRequest {
  string subscription_id = 1;
  repeated string ack_ids = 2;
  int32 ack_deadline_seconds = 3;
}
message ModifyAckDeadlineResponse {
  repeated string modified = 1;
  repeated string unknown = 2;
}
